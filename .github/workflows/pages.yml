name: Deploy test site

# GitHub Pages へ公開します。
#   - main への push
#   - 毎日 20:00 UTC (05:00 JST) … JSONの日付をその日に作り直すため
#   - 手動実行 (Actions → Deploy test site → Run workflow)
#
# リポジトリの Settings → Pages → Source を "GitHub Actions" にしておいてください。
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 日付を含むテストデータ (api/*.json) を当日で作り直す
      - run: node tools/generate.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
